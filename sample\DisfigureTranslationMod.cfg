[General]
EnablePlugin = true

[Detection]
EnableStringDetection = true
LogNewlyDetectedStrings = false

[Translation]
EnableTranslationReplacement = true
TranslationFilename = en.json
EnableDynamicPatterns = true

[Scanning]
ScanIntervalSeconds = 1

[Hotkeys]
ReloadTranslations = F5
ForceRescan = F4
LanguageMenu = F8

[Diagnostics]
LogPopupTranslationAudit = false
