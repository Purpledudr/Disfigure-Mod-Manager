name: Release Sandbox Mode

on:
  push:
    branches: [main]
    paths:
      - "SandboxMode/**"
      - ".github/workflows/release-sandbox.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="sandbox-v0.3.70"
          asset="SandboxMode/release/SandboxMode.dll"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --latest=false --title "Disfigure Sandbox Mode 0.3.70" --notes "Press F5 during a run to open Sandbox Mode. Install through Disfigure Mod Manager or place SandboxMode.dll in BepInEx/plugins."
          fi

