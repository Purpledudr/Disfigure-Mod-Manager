name: Release Sandbox Mode

on:
  push:
    branches: [main]
    paths:
      - "SandboxMode/**"
      - ".github/workflows/release-sandbox.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="sandbox-v0.3.75"
          asset="SandboxMode/release/SandboxMode.dll"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --latest=false --title "Disfigure Sandbox Mode 0.3.75" --notes "Adds a damage cap removed checkbox above the sandbox tabs. Toggle it to bypass the 1,000,000,000 damage cap; unchecking it, Reset, or leaving the run restores the cap. Native damage and multiplier checks passed. Press F5 during a run to open Sandbox Mode."
          fi

