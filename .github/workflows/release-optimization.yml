name: Release Optimization Mod

on:
  push:
    branches: [main]
    paths:
      - "DisfigureOptimizationMod/**"
      - ".github/workflows/release-optimization.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="optimization-v0.3.4"
          asset="DisfigureOptimizationMod/release/DisfigureOptimizationMod.dll"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --latest=false --title "Disfigure Optimization Mod 0.3.4" --notes "Disables expensive post-processing, shadows, motion vectors, and projectile trails without changing gameplay or noticeably changing the visuals. Testing showed roughly 20–35% more FPS, with results depending on hardware and workload. Install through Disfigure Mod Manager or place DisfigureOptimizationMod.dll in BepInEx/plugins."
          fi
