name: Validate community translations

on:
  pull_request:
    paths:
      - "community-translations/**"
      - "translations/community_translation_template.json"
      - "translations/community_documentation_template.json"
      - "translations/community_mod_manager_template.json"
      - "translations/community_sandbox_mod_template.json"
      - "tools/validate_community_translations.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python tools/validate_community_translations.py
